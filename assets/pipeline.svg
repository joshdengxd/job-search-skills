<rect x="346" y="250" width="4" height="44" rx="2" fill="#1F6FEB"/>
<text x="363" y="264" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">claim-verifier</text>
<text x="363" y="282" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Fabrication diff vs master</text>
<text x="363" y="297" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">New numbers, tools, titles</text>
<rect x="345" y="324" width="215" height="64" rx="10" fill="#fff" stroke="#1F6FEB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="346" y="334" width="4" height="44" rx="2" fill="#1F6FEB"/>
<text x="363" y="348" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">resume-pdf</text>
<text x="363" y="366" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">One-column, text-selectable</text>
<text x="363" y="381" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">ATS-safe PDF</text>
