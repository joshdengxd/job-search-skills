<rect x="630" y="156" width="215" height="64" rx="10" fill="#fff" stroke="#2EA44F" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="631" y="166" width="4" height="44" rx="2" fill="#2EA44F"/>
<text x="648" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">ats-check</text>
<text x="648" y="198" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Parse, format, keywords</text>
<text x="648" y="213" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Score >= 90, no hard fail</text>
<rect x="630" y="240" width="215" height="64" rx="10" fill="#fff" stroke="#2EA44F" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="631" y="250" width="4" height="44" rx="2" fill="#2EA44F"/>
<text x="648" y="264" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">resume-auditor</text>
<text x="648" y="282" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Truth, density, 10-second scan</text>
<text x="648" y="297" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Interview-getting power</text>
<rect x="630" y="324" width="215" height="62" rx="10" fill="#F0FAF2" stroke="#2EA44F" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="631" y="334" width="4" height="42" rx="2" fill="#2EA44F"/>
<text x="648" y="348" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">Fresh subagent each round</text>
<text x="648" y="366" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Producer never grades itself</text>
<text x="648" y="381" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Max 2 fix rounds</text>
<path d="M737.5 220 L737.5 238" fill="none" stroke="#57606a" stroke-width="1.6"  marker-end="url(#arg)"/>
<rect x="915" y="156" width="215" height="64" rx="10" fill="#fff" stroke="#6B4FBB" stroke-opacity="0.55" filter="url(#sh)"/>
