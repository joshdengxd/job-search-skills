<text x="656" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#2EA44F">INDEPENDENT CHECKS</text>
<rect x="895" y="100" width="255" height="380" rx="14" fill="#F8F4FF" stroke="#6B4FBB" stroke-opacity="0.35"/>
