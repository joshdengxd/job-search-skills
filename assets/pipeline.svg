<rect x="0.5" y="0.5" width="1189" height="589" rx="18" fill="url(#bg)" stroke="#D0D7DE"/>
<text x="40" y="48" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Per-job pipeline</text>
<text x="40" y="72" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">Every artifact is produced from one verified master. Every check runs in a fresh context. A human submits.</text>
