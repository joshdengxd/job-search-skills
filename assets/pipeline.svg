<circle cx="362" cy="556" r="6" fill="#6B4FBB"/><text x="376" y="560" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Human step</text>
<text x="1150" y="560" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="end">Scheduled job-scan feeds postings in. It never applies.</text>
