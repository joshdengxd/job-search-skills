<text x="933" y="213" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Free-text drafts approved first</text>
<rect x="915" y="240" width="215" height="64" rx="10" fill="#fff" stroke="#6B4FBB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="916" y="250" width="4" height="44" rx="2" fill="#6B4FBB"/>
<text x="933" y="264" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">form-auditor</text>
<text x="933" y="282" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Read-only, before any submit</text>
<text x="933" y="297" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Max 3 rounds, then ask you</text>
<rect x="915" y="324" width="215" height="52" rx="10" fill="#fff" stroke="#6B4FBB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="916" y="334" width="4" height="32" rx="2" fill="#6B4FBB"/>
<text x="933" y="355.0" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">application-tracker</text>
